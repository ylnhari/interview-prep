<title>Interview Prep</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f3f4f7; --surface: #ffffff; --surface-2: #e9ecf2; --surface-3: #d7dce6;
    --ink: #161b22; --ink-dim: #545d6b; --border: #d7dce6; --border-strong: #b7c0cf;
    --accent: #2454cc; --accent-weak: #e5ebfb; --accent-ink: #173c99; --on-accent: #ffffff;
    --danger: #bf3f2a; --danger-weak: #fbe7e2;
    --warning: #9e6f0a; --warning-weak: #fbf0d6;
    --good: #177a5c; --good-weak: #def3ea;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 6px 20px -14px rgba(20,30,50,.18);
    --font-display: 'Sora', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --measure: 70ch;
    --rail-w: 272px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d121c; --surface: #141a27; --surface-2: #1b2331; --surface-3: #283143;
      --ink: #e8edf6; --ink-dim: #9ea9bd; --border: #29324a; --border-strong: #3c4862;
      --accent: #7ea3ff; --accent-weak: #1b2a4d; --accent-ink: #c6d6ff; --on-accent: #0d121c;
      --danger: #ff8a6e; --danger-weak: #3a2013;
      --warning: #f2c463; --warning-weak: #3a2c0c;
      --good: #5fdcb0; --good-weak: #123526;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -18px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d121c; --surface: #141a27; --surface-2: #1b2331; --surface-3: #283143;
    --ink: #e8edf6; --ink-dim: #9ea9bd; --border: #29324a; --border-strong: #3c4862;
    --accent: #7ea3ff; --accent-weak: #1b2a4d; --accent-ink: #c6d6ff; --on-accent: #0d121c;
    --danger: #ff8a6e; --danger-weak: #3a2013;
    --warning: #f2c463; --warning-weak: #3a2c0c;
    --good: #5fdcb0; --good-weak: #123526;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -18px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
  .home { flex: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; padding: 5px 9px 5px 0; border-right: 1px solid var(--border); white-space: nowrap; }
  .home:hover { color: var(--accent); }
  .brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; flex: 1 1 200px; }
  .brand .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { flex: none; display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 5px 11px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; }
  .stat b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .stat.accent { background: var(--accent-weak); color: var(--accent-ink); border-color: transparent; }
  .stat.accent b { color: var(--accent-ink); }
  .ring { width: 26px; height: 26px; border-radius: 50%; flex: none; background: conic-gradient(var(--accent) calc(var(--pct, 0) * 1%), var(--surface-3) 0); display: grid; place-items: center; }
  .ring::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
  .io { flex: none; display: flex; gap: 6px; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; font-weight: 500; }
  .sync { flex: none; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); flex: none; }
  .sync.on::before { background: var(--good); }
  .sync.local::before { background: var(--border-strong); }
  @media (max-width: 760px) {
    .top-inner { padding: 8px 14px; gap: 8px 10px; }
    .brand { flex-basis: calc(100% - 140px); }
    .home { border-right: 0; padding-right: 0; }
    .sync { display: none; }
    .io { margin-left: auto; }
  }

  /* shell */
  .shell { max-width: 1360px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 940px) { .shell { grid-template-columns: minmax(0, 1fr); padding: 14px; } }

  /* rail: course outline */
  .rail { position: sticky; top: 62px; max-height: calc(100vh - 76px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
  .rail > * { flex: none; }
  .continue { background: var(--accent-weak); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 13px; font: inherit; font-size: 12.5px; text-align: left; width: 100%; cursor: pointer; }
  .continue:hover { filter: brightness(1.04); }
  .continue .k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; opacity: .8; }
  .continue .v { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; line-height: 1.35; margin-top: 2px; }
  .continue .s { font-size: 12px; line-height: 1.4; margin-top: 2px; opacity: .85; }
  .toc { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .toc .dh { padding: 8px 12px 6px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .toc .dh span:last-child { color: var(--ink-dim); text-transform: none; letter-spacing: 0; }
  .ti { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; padding: 8px 12px; cursor: pointer; transition: background-color .15s ease; }
  .ti:last-child { border-bottom: 0; }
  .ti:hover { background: var(--surface-2); }
  .ti:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 0; }
  .ti.cur { background: var(--accent-weak); box-shadow: inset 3px 0 0 var(--accent); }
  .ti.cur .t { color: var(--accent-ink); }
  .ti .t { font-weight: 600; font-size: 12.5px; line-height: 1.3; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ti .t > span:first-child { flex: 1 1 auto; min-width: 0; }
  .ti .n { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; color: var(--ink-dim); flex: none; font-variant-numeric: tabular-nums; }
  .ti .m { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: calc(var(--pct, 0) * 1%); background: var(--accent); transition: width .3s ease; }
  .state { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); white-space: nowrap; flex: none; }
  .state.verified { color: var(--good); }
  .ti.gl .t { color: var(--accent-ink); }
  .subtoc { background: var(--surface); border-bottom: 1px solid var(--border); padding: 4px 0 8px; }
  .subtoc .sp { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); padding: 8px 12px 3px 22px; }
  .subtoc .si { display: grid; grid-template-columns: 16px 1fr; gap: 6px; padding: 4px 12px 4px 22px; font-size: 12px; color: var(--ink); text-decoration: none; line-height: 1.35; }
  .subtoc .si:hover { background: var(--surface-2); }
  .subtoc .si:focus-visible { outline-offset: -2px; border-radius: 0; }
  .subtoc .si .sn { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); text-align: right; }
  .subtoc .si.read { color: var(--ink-dim); }
  .subtoc .si.read .sn { color: var(--good); }
  .menu { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
  @media (max-width: 940px) {
    .rail { position: static; max-height: none; }
    .menu { display: inline-block; }
    .rail { display: none; }
    body.menu-open .rail { display: flex; position: fixed; inset: 0; z-index: 30; background: var(--bg); padding: 16px; overflow-y: auto; max-height: none; }
    body.menu-open .book { display: none; }
  }

  .pill { flex: none; font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .pill.danger { background: var(--danger-weak); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .pill.warning { background: var(--warning-weak); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .pill.good { background: var(--good-weak); color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }

  /* book */
  .book { min-width: 0; display: flex; flex-direction: column; gap: 28px; }
  .chapter { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 72px; min-width: 0; max-width: 100%; }
  .chb, .chh { min-width: 0; }
  .chh { padding: 26px 36px 22px; border-bottom: 1px solid var(--border); }
  .chh .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chh h2 { font-family: var(--font-display); font-size: clamp(23px, 1.4vw + 17px, 30px); line-height: 1.18; font-weight: 700; margin: 8px 0 0; letter-spacing: -.02em; text-wrap: balance; max-width: 32ch; }
  .chh .why { margin-top: 12px; color: var(--ink-dim); font-size: 15px; line-height: 1.6; border-left: 2px solid var(--accent); padding-left: 12px; max-width: var(--measure); }
  .chh .mastery { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
  .chh .mastery .bar { flex: 1 1 140px; max-width: 220px; height: 6px; border-radius: 3px; }
  .chb { padding: 8px 36px 30px; }
  @media (max-width: 1100px) { .chh { padding-left: 28px; padding-right: 28px; } .chb { padding-left: 28px; padding-right: 28px; } }
  @media (max-width: 600px) { .chh { padding: 20px 16px 16px; } .chb { padding-left: 16px; padding-right: 16px; } }

  /* diagrams: the drawing keeps a floor width so labels stay legible; the box scrolls on narrow screens */
  .viz, .cviz { margin: 14px 0 6px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  .viz svg, .cviz svg { width: 100%; min-width: 520px; height: auto; display: block; font-family: var(--font-mono); font-size: 11px; }
  .viz, .cviz, .gwrap { max-width: 100%; contain: inline-size; }
  .viz .cap, .cviz .cap { font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); margin-top: 8px; max-width: var(--measure); }
  .viz .cap b, .cviz .cap b { color: var(--ink); }

  /* section: the reading unit */
  .sec { padding: 24px 0 8px; border-top: 1px dashed var(--border); margin-top: 18px; scroll-margin-top: 72px; }
  .sec:first-of-type, .reads + .sec, .viz + .sec, .part + .sec { border-top: 0; }
  .reads + .sec { margin-top: 10px; }
  .part + .sec { padding-top: 12px; }
  .sech { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .sech .num { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent-ink); min-width: 32px; font-variant-numeric: tabular-nums; }
  .sech.read .num { color: var(--good); }
  .sech h3 { font-family: var(--font-display); font-size: 19px; line-height: 1.3; font-weight: 600; margin: 0; letter-spacing: -.008em; flex: 1; text-wrap: balance; }
  .prose { max-width: var(--measure); line-height: 1.65; }
  .prose p { margin: 12px 0; }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose ul, .prose ol { margin: 10px 0; padding-left: 24px; }
  .prose li { margin: 5px 0; }
  .prose li::marker { color: var(--ink-dim); }
  .prose code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .prose b { font-weight: 600; }
  .deeper { margin-top: 14px; padding: 14px 18px; background: var(--surface-2); border-radius: 10px; border-left: 3px solid var(--accent); max-width: var(--measure); }
  .deeper .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); margin-bottom: 6px; }
  .deeper .prose { font-size: 15px; }
  .mcq { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 10px; max-width: var(--measure); background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
  .mcq .q { font-weight: 600; font-size: 14.5px; line-height: 1.45; margin-bottom: 10px; }
  .mcq .q::before { content: "Quick check"; font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); display: block; margin-bottom: 3px; }
  .mcq .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; color: var(--ink); transition: border-color .15s ease, background-color .15s ease; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-weak); }
  .opt.right { border-color: var(--good); background: var(--good-weak); }
  .opt.wrong { border-color: var(--danger); background: var(--danger-weak); }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.right):not(.wrong) { color: var(--ink-dim); }
  .mcq .ex { margin-top: 10px; font-size: 14px; line-height: 1.55; color: var(--ink-dim); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .row .meta, .note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .note { margin-top: 10px; }

  /* external link under a section title (prerequisite chapters) */
  .ext { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 12px; padding: 7px 12px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 13px; text-decoration: none; }
  .ext:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .ext::after { content: "\2197"; font-family: var(--font-mono); font-size: 12px; }

  /* prerequisite checklist chapter */
  .plist { margin-top: 12px; display: flex; flex-direction: column; }
  .pitem { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 0; border-top: 1px dashed var(--border); scroll-margin-top: 72px; }
  .pitem:first-child { border-top: 0; }
  .tick { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: transparent; font-size: 14px; line-height: 1; padding: 0; margin-top: 1px; transition: background-color .15s ease, border-color .15s ease; }
  .tick:hover { border-color: var(--accent); }
  .tick.on { background: var(--good); border-color: var(--good); color: var(--on-accent); }
  .pitem .pt { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; line-height: 1.35; }
  .pitem.done .pt { color: var(--ink-dim); }
  .pitem .pd { font-size: 14px; color: var(--ink-dim); line-height: 1.55; margin: 3px 0 8px; max-width: var(--measure); }
  .pitem .pd p { margin: 0; }
  .pitem .ext { margin: 0; }

  /* buttons */
  .btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 13px; font-weight: 600; font-size: 13px; line-height: 1.3; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); transition: border-color .15s ease, background-color .15s ease, transform .1s ease; }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-2); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost { background: none; border-color: transparent; color: var(--accent-ink); }
  .btn.ghost:hover:not(:disabled) { background: var(--accent-weak); border-color: transparent; }
  .btn.done { background: var(--good-weak); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .btn.done:hover:not(:disabled) { background: var(--good-weak); border-color: var(--good); }

  /* part: a chapter's major movement */
  .part { margin-top: 40px; padding-top: 24px; border-top: 2px solid var(--border-strong); }
  .part .ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .part .ph .lbl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); background: var(--accent-weak); padding: 3px 9px; border-radius: 999px; flex: none; }
  .part .ph h3 { font-family: var(--font-display); font-size: 21px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -.012em; text-wrap: balance; }
  .part .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.5; margin-bottom: 12px; max-width: var(--measure); }
  .part > .prose { margin-top: 12px; }

  /* exercise card */
  .act { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--surface); margin-top: 14px; }
  .act.pass { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .act .ah { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .act .ah h4 { margin: 0; font-family: var(--font-display); font-size: 16.5px; line-height: 1.35; font-weight: 600; flex: 1; text-wrap: balance; }
  .type { font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent-weak); border-radius: 999px; padding: 2px 8px; flex: none; margin-top: 3px; white-space: nowrap; }
  .verdict { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: 2px 9px; flex: none; margin-top: 2px; white-space: nowrap; }
  .verdict.pass { background: var(--good-weak); color: var(--good); }
  .verdict.retry { background: var(--warning-weak); color: var(--warning); }
  .act .prose { font-size: 15.5px; }
  textarea { width: 100%; min-height: 132px; resize: vertical; margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.55; transition: border-color .15s ease; }
  textarea::placeholder { color: var(--ink-dim); opacity: .8; }
  textarea:hover { border-color: var(--accent); }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

<script>
// Progress export/import: pure functions, no DOM, so they can be unit-tested (engine/test_io.js).
window.PREP_IO = (function () {
  var FORMAT = 'interview-prep-progress';
  function serialise(key, state, now) {
    return JSON.stringify({ format: FORMAT, version: 1, key: key, exportedAt: (now || new Date()).toISOString(), state: state }, null, 2);
  }
  function validState(st) {
    return !!st && typeof st === 'object' && !Array.isArray(st) && !!st.topics && typeof st.topics === 'object' && !Array.isArray(st.topics);
  }
  // Returns { state, key } for an export file or a raw state object; throws on anything else.
  function parse(text) {
    var doc = JSON.parse(text);
    var wrapped = !!doc && typeof doc === 'object' && doc.format === FORMAT;
    var st = wrapped ? doc.state : doc;
    if (!validState(st)) throw new Error('That file is not a saved progress file from this course.');
    return { state: st, key: wrapped && typeof doc.key === 'string' ? doc.key : null };
  }
  function filename(key, now) {
    var d = (now || new Date()).toISOString().slice(0, 10);
    return String(key).replace(/^prep-state-/, '').replace(/-v\d+$/, '') + '-progress-' + d + '.json';
  }
  return { FORMAT: FORMAT, serialise: serialise, parse: parse, filename: filename, validState: validState };
})();
</script>

      var sy = el('div', 'say'); sy.appendChild(txt('div', 'lbl', 'Spoken answer')); sy.appendChild(el('div', 'prose', topic.sayItOutLoud)); ps2.appendChild(sy);
      var row4 = el('div', 'row'); var sw = txt('button', 'btn', 'Start stopwatch'); sw.type = 'button'; var tm2 = txt('span', 'timer', ''); var iv2 = null, s = 0;
      sw.addEventListener('click', function () { if (iv2) { clearInterval(iv2); iv2 = null; sw.textContent = 'Start stopwatch'; return; } s = 0; sw.textContent = 'Stop'; tm2.classList.remove('over'); iv2 = setInterval(function () { s++; tm2.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + s % 60 + (s > 100 ? ' (trim)' : ''); if (s > 100) tm2.classList.add('over'); }, 1000); });
      var mk = txt('button', 'btn' + (t.said ? ' done' : ' primary'), t.said ? 'Rehearsed ' + TICK : 'Mark rehearsed'); mk.type = 'button'; mk.setAttribute('aria-pressed', t.said ? 'true' : 'false'); mk.addEventListener('click', function () { t.said = !t.said; persist(topic.id); rerenderChapter(topic); });
      row4.appendChild(sw); row4.appendChild(tm2); row4.appendChild(mk); ps2.appendChild(row4); body.appendChild(ps2);
    }
    ch.appendChild(body); return ch;
  }

  function renderGlossary() {
    var sec = el('section', 'chapter gloss'); sec.id = 'glossary';
    var hd = el('div', 'chh'); hd.appendChild(el('div', 'eyebrow', '<span>Reference</span>')); hd.appendChild(txt('h2', null, 'Glossary')); hd.appendChild(txt('div', 'why', 'Interviewers judge how well you know a subject partly by the words you use for it. Each row gives the term, what it means, where it shows up in your own work, and a phrase you can say out loud. Rows marked "learn / not shipped" are terms to recognise, not ones to claim you have built.')); sec.appendChild(hd);
    var body = el('div', 'chb');
    GLOSSARY.forEach(function (g) {
      var gg = el('div', 'ggroup'); gg.appendChild(txt('h3', null, g.g)); if (g.sub) gg.appendChild(txt('div', 'sub', g.sub));
      var wrap = el('div', 'gwrap'); var tb = el('table', 'gtable'); tb.innerHTML = '<thead><tr><th>Term</th><th>Meaning</th><th>In your experience</th><th>Say it as</th></tr></thead>';
      var tbody = el('tbody'); (g.rows || []).forEach(function (r) { var tr = el('tr'); r.forEach(function (c, i) { var td = txt('td', i === 3 ? 'say' : null, c); tr.appendChild(td); }); tbody.appendChild(tr); }); tb.appendChild(tbody); wrap.appendChild(tb); gg.appendChild(wrap); body.appendChild(gg);
    });
    sec.appendChild(body); return sec;
  }

  // ---------- grading (Claude-published copies only) ----------
  function renderGrade(g) {
    var d = el('div', 'grade'); var gh = el('div', 'gh'); gh.appendChild(txt('span', 'verdict ' + g.verdict, g.verdict === 'pass' ? 'passed' : 'try again')); if (g.score != null) gh.appendChild(txt('span', 'score', 'score ' + g.score + '/100')); d.appendChild(gh);
    d.appendChild(txt('div', 'fb', g.feedback || ''));
    if (g.missing && g.missing.length) { d.appendChild(txt('div', 'lbl', 'What was missing')); var ul = el('ul'); g.missing.forEach(function (m) { ul.appendChild(txt('li', null, m)); }); d.appendChild(ul); }
    if (g.overclaims && g.overclaims.length) { d.appendChild(txt('div', 'lbl', 'Where you claimed more than you did')); var ul2 = el('ul', 'over'); g.overclaims.forEach(function (m) { ul2.appendChild(txt('li', null, m)); }); d.appendChild(ul2); }
    if (g.followup) { d.appendChild(txt('div', 'lbl', 'What the interviewer would ask next')); d.appendChild(txt('div', 'fb', g.followup)); }
    return d;
  }
  function stripHtml(h) { var x = document.createElement('div'); x.innerHTML = h || ''; return x.textContent; }
  function runGrade(o) {
    o.out.innerHTML = ''; var pend = el('div', 'grade'); pend.appendChild(txt('div', 'pending', 'Marking')); o.out.appendChild(pend); o.btn.disabled = true;
    (async function () {
      try {
        if (!graded()) { pend.innerHTML = ''; pend.appendChild(txt('div', 'err', 'Marking only works in a copy of this page published by Claude. Compare your answer with the strong answer instead.')); return; }
        if (!sample) sample = await claude.use('sample');
        if (!sample) { pend.innerHTML = ''; pend.appendChild(txt('div', 'err', 'Marking is not available here. Compare your answer with the strong answer instead.')); return; }
        var prompt = [
          'You are a senior engineer on the hiring panel grading a candidate\'s interview-prep answer for the role described by the rubric. Grade strictly but fairly, as you would in a live interview.',
          '', 'TOPIC: ' + o.topic.title, 'ACTIVITY: ' + o.title, 'TYPE: ' + o.kind,
          '', 'THE TASK THE CANDIDATE WAS GIVEN:', stripHtml(o.prompt),
          '', 'GRADING RUBRIC (authoritative):', stripHtml(o.rubric),
          '', 'REFERENCE STRONG ANSWER (calibration only; do not require the same wording):', stripHtml(o.model),
          '', 'HONESTY RULE (overrides everything): ' + HON + ' Any answer claiming beyond that record is verdict "retry" and each such claim goes in "overclaims". Honest boundary statements are a strength.',
          '', 'CANDIDATE ANSWER:', '"""', o.answer, '"""',
          '', 'Respond with ONLY a JSON object, no prose, no code fence:',
          '{"verdict":"pass"|"retry","score":0-100,"feedback":"2-4 sentences, specific, addressed to the candidate as you","missing":["rubric points not covered, short"],"overclaims":["claims violating the honesty rule, short; empty if none"],"followup":"the single question you would ask next to probe deeper"}',
          'Pass requires: every must-have in the rubric present or clearly implied, no overclaims, and the answer would satisfy you in a live interview. Score >= 70 aligns with pass.'
        ].join('\n');
        var g = await sample.json(prompt, { modelTier: (o.kind === 'formulate' || o.kind === 'story') ? 'complex' : 'default', cache: false });
        if (!g || (g.verdict !== 'pass' && g.verdict !== 'retry')) throw { code: 'invalid_json', message: 'Unexpected grader output' };
        g.missing = Array.isArray(g.missing) ? g.missing.map(String) : []; g.overclaims = Array.isArray(g.overclaims) ? g.overclaims.map(String) : [];
        g.score = typeof g.score === 'number' ? Math.round(g.score) : null; g.feedback = String(g.feedback || ''); g.followup = g.followup ? String(g.followup) : '';
        o.out.innerHTML = ''; o.out.appendChild(renderGrade(g));
        logAttempt({ topicId: o.topic.id, item: o.title, kind: o.kind, answer: o.answer, verdict: g.verdict, score: g.score, feedback: g.feedback, missing: g.missing, overclaims: g.overclaims, followup: g.followup });
        o.onDone(g);
      } catch (e) {
        var code = e && e.code ? e.code : 'error';
        var msg = code === 'not_granted' ? 'Marking needs your permission: reload the page and allow Claude to run on it.' : code === 'rate_limited' ? 'Too many requests. Wait a minute and try again.' : code === 'cancelled' ? 'Cancelled.' : 'Marking failed (' + code + '). Try again.';
        pend.innerHTML = ''; pend.appendChild(txt('div', 'err', msg));
      } finally { o.btn.disabled = false; }
    })();
  }

  // ---------- progress export / import ----------
  async function exportProgress() {
    var json = window.PREP_IO.serialise(LS_KEY, state); var name = window.PREP_IO.filename(LS_KEY);
    /* In a Claude-published copy the viewer blocks plain download links; the downloads capability mediates the save. */
    if (graded()) { try { var dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: json }); return; } } catch (e) { if (e && e.code === 'cancelled') return; } }
    var a = document.createElement('a'); a.download = name; a.rel = 'noopener';
    try { var blob = new Blob([json], { type: 'application/json' }); a.href = URL.createObjectURL(blob); } catch (e) { a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json); }
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { try { if (a.href.indexOf('blob:') === 0) URL.revokeObjectURL(a.href); } catch (e) {} }, 2000);
  }
  function importProgress(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = window.PREP_IO.parse(String(reader.result)); } catch (e) { alert(e && e.message ? e.message : 'Could not read that file.'); return; }
      if (parsed.key && parsed.key !== LS_KEY && !confirm('This file came from a different page (' + parsed.key + '). Load it here anyway? It will replace the progress you have on this page.')) return;
      if (!parsed.key && !confirm('Replace the progress saved on this page with what is in this file?')) return;
      state = parsed.state; if (!state.view) state.view = null;
      persist(); TOPICS.forEach(function (t) { if (state.topics[t.id]) persist(t.id); });
      renderAll(); window.scrollTo({ top: 0 });
    };
    reader.readAsText(file);
  }
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  var importInput = document.getElementById('import-file');
  importInput.addEventListener('change', function () { if (importInput.files && importInput.files[0]) importProgress(importInput.files[0]); importInput.value = ''; });
  document.querySelector('label[for="import-file"]').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); importInput.click(); } });

  // ---------- navigation plumbing ----------
  // in-page anchors: scroll explicitly (hash navigation is unreliable inside an artifact frame)
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1); var target = document.getElementById(id); if (!target) return;
    ev.preventDefault(); closeMenu(); target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (id.indexOf('sec-') === 0 && state.view) setHash(state.view + '/' + id.slice(4));
  });
  var menuBtn = document.getElementById('menu-btn');
  menuBtn.addEventListener('click', function () { var open = document.body.classList.toggle('menu-open'); menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) { var first = document.querySelector('#rail button, #rail a'); if (first) first.focus(); } });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.body.classList.contains('menu-open')) { closeMenu(); menuBtn.focus(); } });
  function renderAll() { renderRail(); renderBook(); }
  function applyHash() {
    var h = (location.hash || '').replace(/^#/, ''); if (!h) return false; var parts = h.split('/'); var vid = decodeURIComponent(parts[0]);
    var ok = (vid === 'who' && C.interviewer) || (vid === 'glossary' && GLOSSARY.length) || TOPICS.some(function (t) { return t.id === vid; });
    if (!ok) return false; state.view = vid; state.pendingScroll = parts[1] ? 'sec-' + decodeURIComponent(parts[1]) : null; return true;
  }
  applyHash();
  if (!state.view) state.view = (orderedTopics()[0] || {}).id;
  renderAll();
  if (state.pendingScroll) { var ps0 = document.getElementById(state.pendingScroll); if (ps0) ps0.scrollIntoView({ block: 'start' }); state.pendingScroll = null; }
  window.addEventListener('hashchange', function () { if (applyHash()) { renderAll(); if (state.pendingScroll) { var e = document.getElementById(state.pendingScroll); if (e) e.scrollIntoView({ block: 'start' }); state.pendingScroll = null; } else window.scrollTo({ top: 0 }); } });

  // ---------- optional server sync (Claude-published copies) ----------
  (async function () {
    if (!graded()) { setSync('local'); return; }
    setSync('connecting');
    try {
      db = await claude.use('db');
      if (!db) { setSync('local'); return; }
      var snaps = await Promise.all(TOPICS.map(function (t) { return db.doc('progress/' + t.id).get(); }));
      snaps.forEach(function (s, i) { if (!s.exists) return; var remote = s.data(); var local = T(TOPICS[i].id); if (!local.updatedAt || (remote.updatedAt && remote.updatedAt > local.updatedAt)) state.topics[TOPICS[i].id] = remote; });
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      setSync('on'); renderAll();
      TOPICS.forEach(function (t) { db.doc('progress/' + t.id).onSnapshot(function (s) { if (!s.exists || s.metadata.hasPendingWrites) return; var remote = s.data(); var local = T(t.id); if (remote.updatedAt && (!local.updatedAt || remote.updatedAt > local.updatedAt)) { state.topics[t.id] = remote; rerenderChapter(t); } }, function () { setSync('local'); }); });
    } catch (e) { setSync('local'); }
  })();
})();
