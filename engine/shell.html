<title>Interview Prep</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f2f4f8; --surface: #ffffff; --surface-2: #e8edf4; --surface-3: #d6dee9;
    --ink: #161b22; --ink-dim: #525c6b; --border: #d6dee9; --border-strong: #b9c4d4;
    --accent: #2454cc; --accent-weak: #e4ebfc; --accent-ink: #173c99; --on-accent: #ffffff;
    --danger: #c1402a; --danger-weak: #fbe7e2;
    --warning: #a3720a; --warning-weak: #fbf0d6;
    --good: #177a5c; --good-weak: #def3ea;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px -12px rgba(20,30,50,.18);
    --font-display: 'Sora', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --measure: 72ch;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d131f; --surface: #141b2a; --surface-2: #1b2436; --surface-3: #28324a;
      --ink: #e8edf6; --ink-dim: #9fabc2; --border: #2a3550; --border-strong: #3d4a68;
      --accent: #7ba1ff; --accent-weak: #1c2c52; --accent-ink: #c4d6ff; --on-accent: #0d131f;
      --danger: #ff8a6e; --danger-weak: #3a2013;
      --warning: #f2c463; --warning-weak: #3a2c0c;
      --good: #5fdcb0; --good-weak: #123526;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d131f; --surface: #141b2a; --surface-2: #1b2436; --surface-3: #28324a;
    --ink: #e8edf6; --ink-dim: #9fabc2; --border: #2a3550; --border-strong: #3d4a68;
    --accent: #7ba1ff; --accent-weak: #1c2c52; --accent-ink: #c4d6ff; --on-accent: #0d131f;
    --danger: #ff8a6e; --danger-weak: #3a2013;
    --warning: #f2c463; --warning-weak: #3a2c0c;
    --good: #5fdcb0; --good-weak: #123526;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 0; margin-right: auto; min-width: 0; flex: 1 1 220px; }
  .brand .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { flex: none; display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 11px; box-shadow: var(--shadow); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; }
  .stat b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .stat.accent { background: var(--accent-weak); color: var(--accent-ink); border-color: transparent; }
  .stat.accent b { color: var(--accent-ink); }
  .ring { width: 26px; height: 26px; border-radius: 50%; flex: none; background: conic-gradient(var(--accent) calc(var(--pct, 0) * 1%), var(--surface-3) 0); display: grid; place-items: center; }
  .ring::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
  .sync { flex: none; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); flex: none; }
  .sync.on::before { background: var(--good); }
  .sync.local::before { background: var(--warning); }
  @media (max-width: 760px) {
    .top-inner { padding: 8px 16px; gap: 8px 10px; }
    .brand { flex-basis: 100%; }
    .sync { margin-right: auto; }
  }
  @media (max-width: 480px) { .sync { flex-basis: 100%; order: 3; } }

  /* shell */
  .shell { max-width: 1360px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 940px) { .shell { grid-template-columns: 1fr; } }

  /* TOC rail */
  .rail { position: sticky; top: 66px; max-height: calc(100vh - 80px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
  .rail > * { flex: none; }
  @media (max-width: 940px) { .rail { position: static; max-height: none; } }
  .today { background: var(--accent-weak); color: var(--accent-ink); border-radius: 12px; padding: 10px 13px; font-size: 12.5px; }
  .today .k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; opacity: .8; }
  .today .v { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; line-height: 1.35; margin-top: 2px; }
  .toc { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .toc .dh { padding: 7px 12px 5px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .toc .dh span:last-child { color: var(--ink-dim); text-transform: none; letter-spacing: 0; }
  .ti { display: block; text-decoration: none; color: inherit; padding: 8px 12px; border-bottom: 1px solid var(--border); transition: background-color .15s ease; }
  .ti:last-child { border-bottom: 0; }
  .ti:hover { background: var(--surface-2); }
  .ti:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 0; }
  .ti.cur { background: var(--accent-weak); box-shadow: inset 3px 0 0 var(--accent); }
  .ti.cur .t { color: var(--accent-ink); }
  .ti .t { font-weight: 600; font-size: 12.5px; line-height: 1.3; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ti .t > span:first-child { flex: 1 1 auto; min-width: 0; }
  .ti .n { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; color: var(--ink-dim); flex: none; font-variant-numeric: tabular-nums; }
  .ti .m { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: calc(var(--pct, 0) * 1%); background: var(--accent); transition: width .3s ease; }
  .state { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); white-space: nowrap; flex: none; }
  .state.verified { color: var(--good); }
  .ti.gl .t { color: var(--accent-ink); }

  .pill { flex: none; font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .pill.danger { background: var(--danger-weak); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .pill.warning { background: var(--warning-weak); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .pill.good { background: var(--good-weak); color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }

  /* book */
  .book { min-width: 0; display: flex; flex-direction: column; gap: 32px; }
  .chapter { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 72px; }
  .chh { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .chh .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chh h2 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; font-weight: 700; margin: 8px 0 0; letter-spacing: -.018em; text-wrap: balance; max-width: 30ch; }
  .chh .why { margin-top: 12px; color: var(--ink-dim); font-size: 15px; line-height: 1.55; border-left: 2px solid var(--accent); padding-left: 12px; max-width: var(--measure); }
  .chh .mastery { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
  .chh .mastery .bar { flex: 1 1 140px; max-width: 220px; height: 6px; border-radius: 3px; }
  .chb { padding: 8px 32px 30px; }
  @media (max-width: 1100px) { .chh { padding-left: 28px; padding-right: 28px; } .chb { padding-left: 28px; padding-right: 28px; } }
  @media (max-width: 600px) { .chh, .chb { padding-left: 16px; padding-right: 16px; } }

  /* diagrams: keep a floor on the drawn width so 9-12px labels stay legible; the box scrolls instead of shrinking the text */
  .viz { margin: 18px 0 6px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
  .viz svg { width: 100%; height: auto; display: block; font-family: var(--font-mono); font-size: 11px; }
  .viz .cap { font-size: 13px; line-height: 1.5; color: var(--ink-dim); margin-top: 10px; max-width: var(--measure); }
  .viz .cap b { color: var(--ink); }

  /* section = the reading unit: hairline dashed rule, numbered heading */
  .sec { padding: 24px 0 8px; border-top: 1px dashed var(--border); margin-top: 18px; scroll-margin-top: 72px; }
  .sec:first-of-type, .reads + .sec, .viz + .sec { border-top: 0; }
  .reads + .sec { margin-top: 10px; }
  .sech { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .sech .num { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent-ink); min-width: 32px; font-variant-numeric: tabular-nums; }
  .sech.read .num { color: var(--good); }
  .sech h3 { font-family: var(--font-display); font-size: 19px; line-height: 1.3; font-weight: 600; margin: 0; letter-spacing: -.008em; flex: 1; text-wrap: balance; }
  .prose { max-width: var(--measure); line-height: 1.65; }
  .prose p { margin: 12px 0; }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose ul, .prose ol { margin: 10px 0; padding-left: 24px; }
  .prose li { margin: 5px 0; }
  .prose li::marker { color: var(--ink-dim); }
  .prose code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .prose b { font-weight: 600; }
  .deeper { margin-top: 14px; padding: 14px 18px; background: var(--surface-2); border-radius: 10px; border-left: 3px solid var(--accent); max-width: var(--measure); }
  .deeper .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); margin-bottom: 6px; }
  .deeper .prose { font-size: 15px; }
  .mcq { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 10px; max-width: var(--measure); background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
  .mcq .q { font-weight: 600; font-size: 14.5px; line-height: 1.45; margin-bottom: 10px; }
  .mcq .q::before { content: "Quick check"; font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); display: block; margin-bottom: 3px; }
  .mcq .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 14px; line-height: 1.45; color: var(--ink); transition: border-color .15s ease, background-color .15s ease; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-weak); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt.right { border-color: var(--good); background: var(--good-weak); }
  .opt.wrong { border-color: var(--danger); background: var(--danger-weak); }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.right):not(.wrong) { color: var(--ink-dim); }
  .mcq .ex { margin-top: 10px; font-size: 14px; line-height: 1.55; color: var(--ink-dim); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  /* buttons */
  .btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 13px; font-weight: 600; font-size: 13px; line-height: 1.3; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); transition: border-color .15s ease, background-color .15s ease, transform .1s ease; }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-2); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost { background: none; border-color: transparent; color: var(--accent-ink); }
  .btn.ghost:hover:not(:disabled) { background: var(--accent-weak); border-color: transparent; }
  .btn.done { background: var(--good-weak); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .btn.done:hover:not(:disabled) { background: var(--good-weak); border-color: var(--good); }

  /* part = a chapter's major movement (Your experience / Exercises / Rehearse): heavier rule, more air, labelled */
  .part { margin-top: 40px; padding-top: 26px; border-top: 2px solid var(--border-strong); }
  .part .ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .part .ph .lbl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); background: var(--accent-weak); padding: 3px 9px; border-radius: 999px; flex: none; }
  .part .ph h3 { font-family: var(--font-display); font-size: 20px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -.012em; text-wrap: balance; }
  .part .sub { color: var(--ink-dim); font-size: 14px; line-height: 1.5; margin-bottom: 12px; max-width: var(--measure); }
  .part > .prose { margin-top: 12px; }

  /* exercise card */
  .act { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--surface); margin-top: 14px; }
  .act.pass { border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
  .act .ah { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .act .ah h4 { margin: 0; font-family: var(--font-display); font-size: 16.5px; line-height: 1.35; font-weight: 600; flex: 1; text-wrap: balance; }
  .type { font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent-weak); border-radius: 999px; padding: 2px 8px; flex: none; margin-top: 3px; white-space: nowrap; }
  .verdict { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: 2px 9px; flex: none; margin-top: 2px; white-space: nowrap; }
  .verdict.pass { background: var(--good-weak); color: var(--good); }
  .verdict.retry { background: var(--warning-weak); color: var(--warning); }
  .act .prose { font-size: 15.5px; }
  textarea { width: 100%; min-height: 132px; resize: vertical; margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.55; transition: border-color .15s ease; }
  textarea::placeholder { color: var(--ink-dim); opacity: .8; }
  textarea:hover { border-color: var(--accent); }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-dim); }
  .timer.over { color: var(--danger); }

  /* grade result: verdict dominant, then feedback, then the lists */
  .grade { margin-top: 14px; padding: 14px 16px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); border-left-width: 4px; border-left-color: var(--border-strong); font-size: 14px; line-height: 1.6; }
  .grade:has(.verdict.pass) { border-left-color: var(--good); }
  .grade:has(.verdict.retry) { border-left-color: var(--warning); }
  .grade .gh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .grade .gh .verdict { font-size: 12px; font-weight: 600; padding: 4px 12px; margin-top: 0; }
  .grade .score { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .grade .fb { max-width: var(--measure); }
  .grade ul { margin: 4px 0 0; padding-left: 20px; max-width: var(--measure); }
  .grade li { margin: 3px 0; }
  .grade .lbl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-dim); margin-top: 12px; }
  .grade .lbl + .fb { margin-top: 4px; }
  .grade .over li { color: var(--danger); }
  .grade .over li::marker { color: var(--danger); }
  .grade .pending { color: var(--ink-dim); font-style: italic; }
  .grade .err { color: var(--danger); }
  .model { margin-top: 14px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-weak); border-radius: 0 10px 10px 0; max-width: var(--measure); }
  .model .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); margin-bottom: 6px; }
  .model .prose { font-size: 15px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .say { margin-top: 14px; padding: 18px 22px; border-left: 3px solid var(--accent); background: var(--accent-weak); border-radius: 0 12px 12px 0; line-height: 1.75; font-size: 16px; max-width: var(--measure); }
  .say .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); margin-bottom: 8px; }
  .say .prose { line-height: inherit; }

  /* interviewer */
  .who { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 72px; }
  .who .wh { padding: 18px 32px; display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; align-items: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .who .av { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; grid-row: span 2; }
  .who .nm { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .who .rl { font-size: 13.5px; color: var(--ink-dim); }
  .who .wb { padding: 8px 32px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; }
  @media (max-width: 1100px) { .who .wh { padding-left: 28px; padding-right: 28px; } .who .wb { padding-left: 28px; padding-right: 28px; } }
  @media (max-width: 760px) { .who .wb { grid-template-columns: 1fr; } .who .wh, .who .wb { padding-left: 16px; padding-right: 16px; } }
  .who h4 { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); margin: 14px 0 6px; }
  .who ul { margin: 0; padding-left: 18px; font-size: 14.5px; line-height: 1.55; }
  .who li + li { margin-top: 5px; }
  .who li::marker { color: var(--ink-dim); }
  .who .src { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }

    var eb = el('div', 'eyebrow'); eb.appendChild(txt('span', null, 'Chapter ' + n + ' · ' + groupOf(topic.id).label)); eb.appendChild(txt('span', 'pill ' + topic.level, topic.levelLabel)); hd.appendChild(eb);
    hd.appendChild(txt('h2', null, topic.title));
    if (topic.why) hd.appendChild(el('div', 'why', topic.why));
    var ms = el('div', 'mastery'); var mb = el('span', 'bar', '<i></i>'); mb.style.setProperty('--pct', p.pct); ms.appendChild(mb); ms.appendChild(txt('span', null, p.pct + '% · ' + p.label + ' · ' + p.rL + '/' + p.nL + ' sections read · ' + p.pA + '/' + p.nA + ' exercises passed')); hd.appendChild(ms);
    if (/question-bank$/.test(topic.id)) { var tg = txt('button', 'btn' + (state.hideAnswers ? ' primary' : ''), state.hideAnswers ? 'Show answers' : 'Hide answers (self-test)'); tg.type = 'button'; tg.style.marginTop = '10px'; tg.addEventListener('click', function () { state.hideAnswers = !state.hideAnswers; persist(); renderBook(); }); hd.appendChild(tg); }
    ch.appendChild(hd);
    var body = el('div', 'chb');

    function appendVizAndReadings() {
      if (VIZ[topic.id]) { var v = el('div', 'viz'); v.innerHTML = VIZ[topic.id].svg + '<div class="cap">' + VIZ[topic.id].cap + '</div>'; body.appendChild(v); }
    if (READINGS[topic.id]) {
        var rd = el('div', 'reads'); var rh = el('div', 'rh'); rh.appendChild(txt('span', 'lbl', 'Primary sources')); rh.appendChild(txt('span', 'sub', 'PRIMER links first if the basics are rusty; the rest instead of re-deriving. Tick when done.')); rd.appendChild(rh);
        READINGS[topic.id].forEach(function (r, ri) {
          var done = !!t.reads[ri]; var row = el('div', 'rd' + (done ? ' done' : ''));
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = done; cb.id = 'rd-' + topic.id + '-' + ri; cb.addEventListener('change', function () { t.reads[ri] = cb.checked; persist(topic.id); row.classList.toggle('done', cb.checked); });
          row.appendChild(cb); var a = txt('a', null, r.l); a.href = r.u; a.target = '_blank'; a.rel = 'noopener'; row.appendChild(a); row.appendChild(txt('span', 'mn', '~' + r.m + ' min')); row.appendChild(txt('div', 'w', r.w)); rd.appendChild(row);
        });

    if (!topic.learn.length) appendVizAndReadings();

    var lastPart = null;
    topic.learn.forEach(function (c, i) {
      if (c.part && c.part !== lastPart && PART_LABEL[c.part]) {

      }
      var read = !!t.learn[c.id];
      var sec = el('div', 'sec'); sec.id = 'sec-' + c.id;
      var sh = el('div', 'sech' + (read ? ' read' : '')); sh.appendChild(txt('span', 'num', read ? '✓' : n + '.' + (i + 1))); sh.appendChild(txt('h3', null, c.title)); sec.appendChild(sh);
      if (c.viz && window.VIZLIB && window.VIZLIB[c.viz]) { var cv = el('div', 'cviz'); cv.innerHTML = window.VIZLIB[c.viz]('v' + Math.random().toString(36).slice(2, 8)) + (window.VIZLIB_CAPTIONS && window.VIZLIB_CAPTIONS[c.viz] ? '<div class="cap">' + window.VIZLIB_CAPTIONS[c.viz] + '</div>' : ''); sec.appendChild(cv); }
      if (/question-bank$/.test(topic.id) && c.deeper) {

        var qs = Array.prototype.slice.call(qb.querySelectorAll('li')), as = Array.prototype.slice.call(ab.querySelectorAll('li'));
        var pr = el('div', 'prose'); var ps = qb.querySelectorAll('p'); if (ps.length) pr.appendChild(ps[0].cloneNode(true));
        var list = el('ul', 'qa');
        qs.forEach(function (q, k) {
          var li = el('li'); var qd = el('div', 'qa-q'); qd.innerHTML = q.innerHTML; li.appendChild(qd);
          if (as[k]) { var ad = el('div', 'qa-a' + (state.hideAnswers ? ' hidden-a' : '')); ad.innerHTML = as[k].innerHTML.replace(/^\s*<b>A\d+\.<\/b>\s*/, ''); li.appendChild(ad); }

        sec.appendChild(pr);
      } else {
        sec.appendChild(el('div', 'prose', c.body));
      }
      if (c.deeper && !/question-bank$/.test(topic.id)) { var dp = el('div', 'deeper'); dp.hidden = !t.learn[c.id + ':deeper']; dp.appendChild(txt('div', 'lbl', /question-bank$/.test(topic.id) ? 'Answers' : 'One level deeper')); dp.appendChild(el('div', 'prose', c.deeper)); sec.appendChild(dp); }
      if (c.check) {
        var mq = el('div', 'mcq'); mq.appendChild(txt('div', 'q', c.check.question)); var opts = el('div', 'opts'); var chosen = t.checks[c.id];
        c.check.options.forEach(function (o, oi) { var ob = txt('button', 'opt', o); ob.type = 'button'; if (chosen != null) { ob.disabled = true; if (oi === c.check.answer) ob.classList.add('right'); else if (oi === chosen) ob.classList.add('wrong'); } ob.addEventListener('click', function () { t.checks[c.id] = oi; if (oi === c.check.answer) t.learn[c.id] = true; persist(topic.id); rerenderChapter(topic); }); opts.appendChild(ob); });
        mq.appendChild(opts); if (chosen != null) mq.appendChild(txt('div', 'ex', (chosen === c.check.answer ? 'Right. ' : 'Not quite. ') + c.check.explain)); sec.appendChild(mq);
      }
      var row = el('div', 'row');
      var got = txt('button', 'btn' + (read ? ' done' : ' primary'), read ? 'Understood ✓' : 'Understood'); got.type = 'button'; got.addEventListener('click', function () { t.learn[c.id] = !read; persist(topic.id); rerenderChapter(topic); }); row.appendChild(got);
      if (c.deeper && !/question-bank$/.test(topic.id)) { var db2 = txt('button', 'btn ghost', /question-bank$/.test(topic.id) ? (t.learn[c.id + ':deeper'] ? 'Hide answers' : 'Reveal answers') : (t.learn[c.id + ':deeper'] ? 'Hide the deeper layer' : 'Go one level deeper')); db2.type = 'button'; db2.addEventListener('click', function () { t.learn[c.id + ':deeper'] = !t.learn[c.id + ':deeper']; persist(topic.id); rerenderChapter(topic); }); row.appendChild(db2); }
      sec.appendChild(row); body.appendChild(sec);

    // connect
    if (topic.connect) {

      var row2 = el('div', 'row'); var gb = txt('button', 'btn primary', 'Grade my mapping'); gb.type = 'button'; var rv = txt('button', 'btn ghost', 'Show the honest mapping'); rv.type = 'button'; row2.appendChild(gb); row2.appendChild(rv);

    }

    // exercises
    if (topic.activities.length) {
      var px = el('div', 'part'); px.id = 'ex-' + topic.id; var ph2 = el('div', 'ph'); ph2.appendChild(txt('span', 'lbl', 'Exercises')); ph2.appendChild(txt('h3', null, 'Prove it to yourself')); px.appendChild(ph2);

      topic.activities.forEach(function (a) {
        var st = AC(topic.id, a.id); var box2 = el('div', 'act' + (st.status === 'pass' ? ' pass' : ''));
        var ah = el('div', 'ah'); ah.appendChild(txt('span', 'type', a.type)); ah.appendChild(txt('h4', null, a.title)); if (st.status !== 'none') ah.appendChild(txt('span', 'verdict ' + st.status, st.status)); box2.appendChild(ah);
        if (a.viz && window.VIZLIB && window.VIZLIB[a.viz]) { var av = el('div', 'cviz'); av.innerHTML = window.VIZLIB[a.viz]('a' + Math.random().toString(36).slice(2, 8)); box2.appendChild(av); }
        box2.appendChild(el('div', 'prose', a.prompt));
        var ta2 = document.createElement('textarea'); ta2.placeholder = a.type === 'formulate' ? 'Decision variables → objective → constraints → problem class…' : 'Answer in first person, as you would say it…'; ta2.value = st.lastAnswer || ''; box2.appendChild(ta2);
        var row3 = el('div', 'row'); var gb2 = txt('button', 'btn primary', st.status === 'pass' ? 'Grade again' : 'Grade with Claude'); gb2.type = 'button'; row3.appendChild(gb2);
        if (a.timeboxSec) { var tb = txt('button', 'btn', 'Start ' + Math.round(a.timeboxSec / 6) / 10 + ' min timer'); tb.type = 'button'; var tm = txt('span', 'timer', ''); var iv = null, left = a.timeboxSec;
          tb.addEventListener('click', function () { if (iv) { clearInterval(iv); iv = null; tb.textContent = 'Restart timer'; return; } left = a.timeboxSec; tb.textContent = 'Stop'; tm.classList.remove('over'); iv = setInterval(function () { left--; var mm = Math.floor(Math.abs(left) / 60), ss = Math.abs(left) % 60; tm.textContent = (left < 0 ? '−' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss; if (left < 0) tm.classList.add('over'); }, 1000); });
          row3.appendChild(tb); row3.appendChild(tm); }
        var rv2 = txt('button', 'btn ghost', 'Show a strong answer'); rv2.type = 'button'; row3.appendChild(rv2);
        if (st.attempts) row3.appendChild(txt('span', 'meta', st.attempts + ' attempt' + (st.attempts > 1 ? 's' : '') + (st.lastScore != null ? ' · last ' + st.lastScore : ''))); box2.appendChild(row3);
        var out2 = el('div'); box2.appendChild(out2); if (st.last) out2.appendChild(renderGrade(st.last));
        var md2 = el('div', 'model'); md2.hidden = true; md2.appendChild(txt('div', 'lbl', 'Strong answer')); md2.appendChild(el('div', 'prose', a.model)); box2.appendChild(md2);
        rv2.addEventListener('click', function () { if (md2.hidden && !st.attempts && !confirm('You have not attempted this yet. Reveal the strong answer anyway?')) return; md2.hidden = !md2.hidden; });
        gb2.addEventListener('click', function () { var ans = ta2.value.trim(); if (ans.length < 20) { ta2.focus(); return; }
          runGrade({ kind: a.type, topic: topic, title: a.title, prompt: a.prompt, rubric: a.rubric, model: a.model, answer: ans, out: out2, btn: gb2, onDone: function (g) { st.attempts++; st.last = g; st.lastAnswer = ans; st.lastScore = g.score; st.status = g.verdict === 'pass' ? 'pass' : 'retry'; persist(topic.id); rerenderChapter(topic); } }); });
        px.appendChild(box2);
      });
      body.appendChild(px);
    }

    // say it
    if (topic.sayItOutLoud) {
      var ps = el('div', 'part'); ps.id = 'say-' + topic.id; var ph3 = el('div', 'ph'); ph3.appendChild(txt('span', 'lbl', 'Rehearse')); ph3.appendChild(txt('h3', null, 'Your spoken answer')); ps.appendChild(ph3);
      if (topic.sayQuestion) { var sq = el('div', 'sayq'); sq.appendChild(txt('span', 'lbl', 'If he asks')); sq.appendChild(txt('span', null, topic.sayQuestion)); ps.appendChild(sq); }
      ps.appendChild(txt('div', 'sub', 'This is what you say, in your own words, when he asks the question below. Say it unscripted, time it (60 to 90 seconds), then mark it rehearsed.'));
      var sy = el('div', 'say'); sy.appendChild(txt('div', 'lbl', 'Your answer, out loud')); sy.appendChild(el('div', 'prose', topic.sayItOutLoud)); ps.appendChild(sy);
      var row4 = el('div', 'row'); var sw = txt('button', 'btn', 'Start stopwatch'); sw.type = 'button'; var tm2 = txt('span', 'timer', ''); var iv2 = null, s = 0;
      sw.addEventListener('click', function () { if (iv2) { clearInterval(iv2); iv2 = null; sw.textContent = 'Start stopwatch'; return; } s = 0; sw.textContent = 'Stop'; tm2.classList.remove('over'); iv2 = setInterval(function () { s++; tm2.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + s % 60 + (s > 100 ? ' — trim' : ''); if (s > 100) tm2.classList.add('over'); }, 1000); });
      var mk = txt('button', 'btn' + (t.said ? ' done' : ' primary'), t.said ? 'Rehearsed ✓' : 'Mark rehearsed'); mk.type = 'button'; mk.addEventListener('click', function () { t.said = !t.said; persist(topic.id); rerenderChapter(topic); });
      row4.appendChild(sw); row4.appendChild(tm2); row4.appendChild(mk); ps.appendChild(row4); body.appendChild(ps);
    }
    ch.appendChild(body); return ch;
  }

  function renderGlossary() {
    var sec = el('section', 'chapter gloss'); sec.id = 'glossary';
    var hd = el('div', 'chh'); hd.appendChild(el('div', 'eyebrow', '<span>Reference</span>')); hd.appendChild(txt('h2', null, 'Glossary: what you built, and what to call it')); hd.appendChild(txt('div', 'why', 'Interviewers grade vocabulary as a proxy for depth. Every row: the term, what it means, where it lives in your record, and a phrase you can say. Rows marked "learn / not shipped" are for recognition, not claiming.')); sec.appendChild(hd);
    var body = el('div', 'chb');
    GLOSSARY.forEach(function (g) {
      var gg = el('div', 'ggroup'); gg.appendChild(txt('h3', null, g.g)); gg.appendChild(txt('div', 'sub', g.sub));
      var wrap = el('div', 'gwrap'); var tb = el('table', 'gtable'); tb.innerHTML = '<thead><tr><th>Term</th><th>Meaning</th><th>In your record</th><th>Say it as</th></tr></thead>';
      var tbody = el('tbody'); g.rows.forEach(function (r) { var tr = el('tr'); r.forEach(function (c, i) { var td = txt('td', i === 3 ? 'say' : null, c); tr.appendChild(td); }); tbody.appendChild(tr); }); tb.appendChild(tbody); wrap.appendChild(tb); gg.appendChild(wrap); body.appendChild(gg);
    });
    sec.appendChild(body); return sec;
  }

  // ---------- grading ----------
  function renderGrade(g) {
    var d = el('div', 'grade'); var gh = el('div', 'gh'); gh.appendChild(txt('span', 'verdict ' + g.verdict, g.verdict)); if (g.score != null) gh.appendChild(txt('span', 'score', 'score ' + g.score + '/100')); d.appendChild(gh);
    d.appendChild(txt('div', 'fb', g.feedback || ''));
    if (g.missing && g.missing.length) { d.appendChild(txt('div', 'lbl', 'Missing')); var ul = el('ul'); g.missing.forEach(function (m) { ul.appendChild(txt('li', null, m)); }); d.appendChild(ul); }
    if (g.overclaims && g.overclaims.length) { d.appendChild(txt('div', 'lbl', 'Overclaims — fix these')); var ul2 = el('ul', 'over'); g.overclaims.forEach(function (m) { ul2.appendChild(txt('li', null, m)); }); d.appendChild(ul2); }
    if (g.followup) { d.appendChild(txt('div', 'lbl', 'The interviewer would push next')); d.appendChild(txt('div', 'fb', g.followup)); }
    return d;
  }
  function stripHtml(h) { var x = document.createElement('div'); x.innerHTML = h || ''; return x.textContent; }
  function runGrade(o) {
    o.out.innerHTML = ''; var pend = el('div', 'grade'); pend.appendChild(txt('div', 'pending', 'Grading…')); o.out.appendChild(pend); o.btn.disabled = true;
    (async function () {
      try {
        if (!sample) sample = await claude.use('sample');
        if (!sample) { pend.innerHTML = ''; pend.appendChild(txt('div', 'err', 'Claude grading is not available in this view. Compare with the strong answer and self-assess.')); o.btn.disabled = false; return; }
        var prompt = [
          'You are a senior engineer on the hiring panel grading a candidate\'s interview-prep answer for the role described by the rubric. Grade strictly but fairly, as you would in the room.',
          '', 'TOPIC: ' + o.topic.title, 'ACTIVITY: ' + o.title, 'TYPE: ' + o.kind,
          '', 'THE TASK THE CANDIDATE WAS GIVEN:', stripHtml(o.prompt),
          '', 'GRADING RUBRIC (authoritative):', stripHtml(o.rubric),
          '', 'REFERENCE STRONG ANSWER (calibration only — do not require the same wording):', stripHtml(o.model),
          '', 'HONESTY RULE (overrides everything): ' + HON + ' Any answer claiming beyond that record is verdict "retry" and each such claim goes in "overclaims". Honest boundary statements are a strength.',
          '', 'CANDIDATE ANSWER:', '"""', o.answer, '"""',
          '', 'Respond with ONLY a JSON object, no prose, no code fence:',
          '{"verdict":"pass"|"retry","score":0-100,"feedback":"2-4 sentences, specific, addressed to the candidate as you","missing":["rubric points not covered, short"],"overclaims":["claims violating the honesty rule, short; empty if none"],"followup":"the single question you would ask next to probe deeper"}',
          'Pass requires: every must-have in the rubric present or clearly implied, no overclaims, and the answer would satisfy you in a live room. Score ≥ 70 aligns with pass.'
        ].join('\n');
        var g = await sample.json(prompt, { modelTier: (o.kind === 'formulate' || o.kind === 'story') ? 'complex' : 'default', cache: false });
        if (!g || (g.verdict !== 'pass' && g.verdict !== 'retry')) throw { code: 'invalid_json', message: 'Unexpected grader output' };
        g.missing = Array.isArray(g.missing) ? g.missing.map(String) : []; g.overclaims = Array.isArray(g.overclaims) ? g.overclaims.map(String) : [];
        g.score = typeof g.score === 'number' ? Math.round(g.score) : null; g.feedback = String(g.feedback || ''); g.followup = g.followup ? String(g.followup) : '';
        o.out.innerHTML = ''; o.out.appendChild(renderGrade(g));
        logAttempt({ topicId: o.topic.id, item: o.title, kind: o.kind, answer: o.answer, verdict: g.verdict, score: g.score, feedback: g.feedback, missing: g.missing, overclaims: g.overclaims, followup: g.followup });
        o.onDone(g);
      } catch (e) {
        var code = e && e.code ? e.code : 'error';
        var msg = code === 'not_granted' ? 'Grading needs your consent — reload and allow Claude on this page.' : code === 'rate_limited' ? 'Rate limited — wait a minute and try again.' : code === 'cancelled' ? 'Cancelled.' : 'Grading failed (' + code + '). Try again.';
        pend.innerHTML = ''; pend.appendChild(txt('div', 'err', msg));
      } finally { o.btn.disabled = false; }
    })();
  }

  // in-page anchors: scroll explicitly (hash navigation is unreliable inside the artifact frame)
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="#"]'); if (!a) return;
    var id = a.getAttribute('href').slice(1); var target = document.getElementById(id); if (!target) return;
    ev.preventDefault(); document.body.classList.remove('menu-open'); target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('menu-btn').addEventListener('click', function () { document.body.classList.toggle('menu-open'); });
  function renderAll() { renderRail(); renderBook(); }
  (function () { var h = (location.hash || '').replace(/^#/, ''); if (!h) return; var parts = h.split('/'); var vid = parts[0]; var ok = vid === 'who' || vid === 'glossary' || TOPICS.some(function (t) { return t.id === vid; }); if (ok) { state.view = vid; state.pendingScroll = parts[1] ? 'sec-' + parts[1] : null; } })();
  if (!state.view) state.view = C.interviewer ? 'who' : orderedTopics()[0].id;
  renderAll();
  if (state.pendingScroll) { var ps0 = document.getElementById(state.pendingScroll); if (ps0) ps0.scrollIntoView({ block: 'start' }); state.pendingScroll = null; }

  (async function () {
    try {
      db = await claude.use('db');
      if (!db) { setSync('local'); return; }
      var snaps = await Promise.all(TOPICS.map(function (t) { return db.doc('progress/' + t.id).get(); }));
      snaps.forEach(function (s, i) { if (!s.exists) return; var remote = s.data(); var local = T(TOPICS[i].id); if (!local.updatedAt || (remote.updatedAt && remote.updatedAt > local.updatedAt)) state.topics[TOPICS[i].id] = remote; });
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      setSync('on'); renderAll();
      TOPICS.forEach(function (t) { db.doc('progress/' + t.id).onSnapshot(function (s) { if (!s.exists || s.metadata.hasPendingWrites) return; var remote = s.data(); var local = T(t.id); if (remote.updatedAt && (!local.updatedAt || remote.updatedAt > local.updatedAt)) { state.topics[t.id] = remote; rerenderChapter(t); } }, function () { setSync('local'); }); });
    } catch (e) { setSync('local'); }
  })();
})();
