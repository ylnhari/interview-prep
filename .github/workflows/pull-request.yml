name: Public pull request checks

on:
  pull_request:
    branches: [main]

# Fork pull requests must be able to run every check without Firebase, Pages,
# deployment credentials, or any other secret.
permissions:
  contents: read

concurrency:
  group: public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-rules:
    name: Public Firestore rules checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firestore rules test dependencies
        run: npm ci
      - name: Test public Firestore rules in the emulator
        run: npm run test:public-rules

  public-course:
    name: Public course checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test public delivery boundary
        run: python -m unittest engine.test_public_build
      - name: Test guest progress import and export
        run: node engine/test_io.js
      - name: Test optional public progress adapter
        run: node engine/test_public_progress.js
      - name: Test public shell behavior
        run: node engine/test_public_shell_behavior.cjs
      - name: Test teaching order and responsive architecture
        run: |
          node engine/test_teaching_order.cjs
          node engine/test_rag_architecture.cjs
      - name: Test progress compatibility guard
        run: node engine/test_progress_compatibility.cjs
      - name: Verify saved-progress compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node engine/check_progress_compatibility.cjs "$BASE_SHA" "$HEAD_SHA"
      - name: Build and validate the guest public course
        run: |
          python engine/public_build.py --output-dir public-dist-guest
          node engine/check.js public-dist-guest/course.html
      - name: Build and validate configured public course when reviewed config exists
        run: |
          if [ -f config/public-sync.json ]; then
            python engine/public_build.py --public-sync-config config/public-sync.json
            node engine/check.js public-dist/course.html
          else
            echo "No reviewed public sync configuration: guest build is the production shape."
          fi
