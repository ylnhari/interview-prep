name: Build and deploy the public course

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full committed public baseline SHA to compare with this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  public-rules:
    # Emulator only: no Firebase credentials, rules deployment, or data access.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firestore rules test dependencies
        run: npm ci
      - name: Test public Firestore rules in the emulator
        run: npm run test:public-rules

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test public delivery boundary
        run: python -m unittest engine.test_public_build
      - name: Test optional public progress adapter
        run: node engine/test_public_progress.js
      - name: Test public shell behavior
        run: node engine/test_public_shell_behavior.cjs
      - name: Test guest backups and teaching order
        run: |
          node engine/test_io.js
          node engine/test_teaching_order.cjs
          node engine/test_rag_architecture.cjs
      - name: Test visual learning and audited executable examples
        run: |
          node engine/test_visual_course.cjs
          node engine/test_course_catalog.cjs
          node engine/test_interactive_practice.cjs
          node engine/test_feature_platform.cjs
          node engine/test_ai_audit.cjs
          node engine/test_decision_audit.cjs
          node engine/test_systems_audit.cjs
          python -m unittest engine.test_ml_content engine.test_coding_sql
      - name: Test progress compatibility guard
        run: node engine/test_progress_compatibility.cjs
      - name: Verify saved-progress compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.baseline_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No predecessor exists for this first push; tests and schema checks run, but continuity is not proven."
          else
            node engine/check_progress_compatibility.cjs "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Build and validate the guest public course
        run: |
          python engine/public_build.py --output-dir public-dist-guest
          node engine/check.js public-dist-guest/course.html
      - name: Build the published public course
        run: |
          if [ -f config/public-sync.json ]; then
            python engine/public_build.py --public-sync-config config/public-sync.json
          else
            python engine/public_build.py
          fi
      - name: Validate the published public course page
        run: node engine/check.js public-dist/course.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist

  deploy:
    needs: [build, public-rules]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
