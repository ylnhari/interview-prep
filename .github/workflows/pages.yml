name: Build and deploy the public course

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full committed public baseline SHA to compare with this run
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test progress compatibility guard
        run: node engine/test_progress_compatibility.cjs
      - name: Verify saved-progress compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.baseline_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No predecessor exists for this first push; tests and schema checks run, but continuity is not proven."
          else
            node engine/check_progress_compatibility.cjs "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Build the allowlisted public course
        run: python engine/public_build.py
      - name: Validate the public course page
        run: node engine/check.js public-dist/course.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
